name: Publish to Expo

on:
  push:
    branches: [claude/r300-trade-bot-build-w6gVn, main]
    paths: [mobile/**]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/r300-trade-bot-build-w6gVn

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Install dependencies
        run: npm install --legacy-peer-deps
        working-directory: mobile

      - name: Initialize EAS project
        run: eas init --non-interactive --force
        working-directory: mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Publish EAS Update
        run: eas update --branch production --message "Deploy from GitHub Actions" --non-interactive
        working-directory: mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
